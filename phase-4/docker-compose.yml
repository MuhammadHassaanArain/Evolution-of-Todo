version: "3.8"

services:
  mcp-server:
    build:
      context: ./backend/mcp-server
    container_name: todo-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
    restart: unless-stopped
    networks:
      - todo-network

  backend:
    build:
      context: ./backend
    container_name: todo-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ./backend/.env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001/mcp/
      - ALLOWED_ORIGINS=*
    depends_on:
      - mcp-server
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
